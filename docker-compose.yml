version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: typing-test-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    container_name: typing-test-server
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/typing-speed-tester
      - JWT_SECRET=your-secret-key
    depends_on:
      - mongodb

  client:
    build: ./client
    container_name: typing-test-client
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  mongo-data:
